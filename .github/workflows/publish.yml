name: Publikovat denní citát

on:
  # Cron ZÁMĚRNĚ vypnutý — spouští to Google Apps Script (workflow_dispatch)
  # každý den v 18:00 Europe/Prague. GitHub cron byl nespolehlivý (zpoždění).
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Nainstalovat závislosti
        run: pip install -r requirements.txt
      - name: Publikovat
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          SCHEDULE_START: '2026-10-23'
          TZ: Europe/Prague
        run: python publish.py
