name: Publikovat denní citát

on:
  schedule:
    # 16:23 UTC = ~18:23 Praha (léto) / ~17:23 Praha (zima). Mimo celou hodinu
    # (méně zpoždění). Bez striktní hodinové kontroly - publikuje se vždy.
    - cron: '23 16 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Nainstalovat závislosti
        run: pip install -r requirements.txt
      - name: Publikovat
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          SCHEDULE_START: '2026-10-23'
          TZ: Europe/Prague
        run: python publish.py
